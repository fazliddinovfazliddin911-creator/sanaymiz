<title>Sanaymiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one phone column. Home = Continue button, daily challenge, world cards, hero picker.
   World = 50 level tiles in a 5-column grid. Play = hearts and question card on top, number stones
   with a road below where the hero walks to the answer the child taps. Done = stars, gift, sticker.
   Rewards = hats for the hero and a sticker album. Chunky ink outlines and pressed-button shadows
   keep it toy-like. One bright light look on purpose; world colours change the page background. */
:root {
  --bg: #D8F3E4;
  --card: #FFFFFF;
  --ink: #1E2B4A;
  --muted: #4A5B78;
  --orange: #FF7A2F;
  --sun: #FFC933;
  --pink: #FF8FB1;
  --green: #4FD58F;
  --sky: #86BEFF;
  --good: #22B573;
  --bad: #FFD3DE;
  --heart: #FF4D6D;
  --lock: #C9D6CF;
  --road: #D9C79B;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.4;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  transition: background 0.4s;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 4px solid #2F7BFF; outline-offset: 3px; }
[hidden] { display: none !important; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; text-wrap: balance; }
h1 { font-size: 1.8rem; line-height: 1.1; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; min-width: 0; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 11px; min-height: 42px;
  font-weight: 800; box-shadow: 0 3px 0 var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pipline { display: flex; align-items: center; gap: 12px; }
.pipbox { width: 80px; flex: none; }
.pip { width: 100%; height: auto; display: block; overflow: visible; }
.pip .eh, .pip .mo { display: none; }
.pip[data-mood="happy"] .eo { display: none; }
.pip[data-mood="happy"] .eh { display: inline; }
.pip[data-mood="happy"] .ms { display: none; }
.pip[data-mood="happy"] .mo { display: inline; }
.bubble {
  position: relative; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px;
  font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; line-height: 1.2; min-width: 0; flex: 1;
}
.bubble::before {
  content: ""; position: absolute; left: -11px; top: 50%; width: 16px; height: 16px; background: var(--card);
  border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateY(-50%) rotate(45deg);
}

/* hero */
.hwrap { position: relative; width: 100%; }
.hat { position: absolute; left: 50%; top: -18%; transform: translateX(-50%); font-size: 1.5rem; line-height: 1; pointer-events: none; }
.hero .hat { font-size: 1.5rem; }
.herobig .hat { font-size: 2.8rem; top: -22%; }
.hp .hat { font-size: 1.1rem; top: -26%; }
.heropick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.heropick > span { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.hp {
  display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--ink); border-radius: 16px;
  padding: 4px 14px 4px 6px; box-shadow: 0 4px 0 var(--ink); font-weight: 800;
}
.hp .hwrap { width: 40px; }
.hp svg { width: 40px; height: 38px; display: block; }
.hp[aria-pressed="true"] { background: var(--sun); }

/* home */
.cont {
  font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; background: var(--orange); color: #fff; width: 100%;
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); padding: 14px; min-height: 64px;
}
.cont:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.dcard {
  background: var(--card); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink);
  padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.dcard .dt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.dcard .dt b { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.dcard .dt small { font-weight: 800; color: var(--muted); }
.btn-s {
  font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; background: var(--sun); border: 3px solid var(--ink);
  border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 8px 14px; min-height: 48px;
}
.btn-s:disabled { background: var(--lock); color: #50615A; box-shadow: 0 4px 0 #8FA398; border-color: #6B7C74; }
.btn-s:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.sec { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 4px 0 0; }
.wlist { display: flex; flex-direction: column; gap: 10px; }
.wcard {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--c, #fff);
  border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding: 10px 12px; min-width: 0;
}
.wcard:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.wcard.lock { background: var(--lock); color: #50615A; box-shadow: 0 5px 0 #8FA398; border-color: #6B7C74; }
.wcard .wt { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 4px; }
.wcard b { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; line-height: 1.1; }
.wcard small { font-weight: 800; color: var(--muted); }
.wcard.lock small { color: #50615A; }
.wi { font-size: 2rem; line-height: 1; flex: none; }
.pbar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.75); border: 2px solid var(--ink); overflow: hidden; display: block; }
.pbar i { display: block; height: 100%; background: var(--good); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; text-decoration: underline; color: var(--muted); font-weight: 800; padding: 10px 4px; text-align: left; }

/* world */
.wtitle { display: flex; align-items: center; gap: 12px; }
.wtitle .wi { font-size: 2.6rem; }
.lvgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.lt {
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink);
  padding: 6px 2px 7px; display: flex; flex-direction: column; align-items: center; min-width: 0; font-family: var(--font-display); font-weight: 800;
}
.lt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.lt .n { font-size: 1.35rem; line-height: 1.1; }
.lt .s { font-size: 0.8rem; line-height: 1; color: #E09A00; letter-spacing: 1px; font-family: var(--font-body); }
.lt .s i { font-style: normal; color: #B9C4BF; }
.lt.boss { background: var(--sun); }
.lt.lock { background: var(--lock); color: #50615A; box-shadow: 0 3px 0 #8FA398; border-color: #6B7C74; }
.lt .ic { font-size: 0.85rem; line-height: 1; }

/* play */
.playbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--card); }
.dot.done { background: var(--good); }
.dot.cur { background: var(--sun); }
.hearts { display: flex; gap: 4px; }
.heart { width: 30px; height: 30px; display: block; }
.heart path { fill: var(--heart); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.heart.lost path { fill: #fff; opacity: 0.55; }
.qcard {
  background: var(--card); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
  padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0;
}
.prompt { font-size: 1.35rem; text-align: center; line-height: 1.15; }
.visual { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 4rem; width: 100%; }
.visual:empty { display: none; }
.msg { min-height: 2.5rem; text-align: center; }
.msg span { display: inline-block; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 16px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 17rem; }
.tray.sm { max-width: 8.5rem; }
.it { font-size: 1.9rem; width: 2.8rem; text-align: center; line-height: 1.2; display: block; }
.sm .it { font-size: 1.5rem; width: 2rem; }
.it.gone { opacity: 0.3; filter: grayscale(1); position: relative; }
.it.gone::after { content: "\2715"; position: absolute; inset: 0; color: #D6264F; font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
.eq { font-family: var(--font-display); font-weight: 800; font-size: 2.5rem; line-height: 1.1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
.eqrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; }
.op { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.blank, .num.q {
  display: inline-grid; place-items: center; min-width: 1.5em; border-radius: 14px; border: 3px dashed var(--ink); background: #FFF1B8; padding: 0 8px;
}
.blank.shown, .num.q.shown { border-style: solid; background: #BFF0D6; }
.dotrow { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 16rem; }
.dt2 { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.dt2.a { background: #5B9BFF; }
.dt2.b { background: var(--orange); }
.arr { display: grid; gap: 4px; justify-content: center; }
.arr span { font-size: 1.2rem; line-height: 1; text-align: center; }
.baskets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.baskets span { font-size: 1.8rem; line-height: 1; }
.seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.num {
  font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; min-width: 3.2rem; height: 3.4rem; padding: 0 8px; border-radius: 14px;
  border: 3px solid var(--ink); background: var(--sky); display: grid; place-items: center;
}
.bignum { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1; }
.blocks { display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
.bgrp { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bgrp small { font-weight: 800; color: var(--muted); font-size: 0.85rem; }
.rods { display: flex; gap: 4px; align-items: flex-end; }
.rod { width: 15px; height: 84px; border-radius: 4px; border: 2px solid var(--ink); background: repeating-linear-gradient(#5B9BFF 0 7px, #fff 7px 8px); }
.cubes { display: flex; flex-wrap: wrap; gap: 4px; width: 96px; align-content: flex-end; }
.cube { width: 15px; height: 15px; border-radius: 3px; border: 2px solid var(--ink); background: var(--orange); }
.rods.mini .rod { height: 44px; width: 11px; }
.rods.mini .rod.o { background: repeating-linear-gradient(var(--orange) 0 7px, #fff 7px 8px); }
.place { display: flex; gap: 14px; justify-content: center; }
.pc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pc .lab { font-weight: 800; color: var(--muted); }
.pc .dig { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; width: 4.2rem; height: 4.8rem; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 16px; background: var(--sky); }
.pc:nth-child(2) .dig { background: #FFD9A0; }
.stage { display: flex; flex-direction: column; gap: 4px; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.opt {
  font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; min-height: 78px; padding: 6px;
  background: var(--card); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; min-width: 0;
}
.opt:hover:not(:disabled) { background: #FFF1B8; }
.opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.opt.right { background: var(--good); color: #fff; }
.opt.wrong { background: var(--bad); opacity: 0.65; }
.opt:disabled { cursor: default; }
.opt.card { min-height: 0; padding: 10px 6px; }
.walk { position: relative; height: 124px; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-radius: 17px; background: var(--road); border: 3px solid var(--ink); }
.road::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 3px dashed rgba(30, 43, 74, 0.35); }
.scene { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: space-around; font-size: 1.4rem; line-height: 1; pointer-events: none; }
.hero { position: absolute; bottom: 9px; left: 50%; width: 60px; transform: translateX(-50%); }
.hs { width: 100%; height: auto; display: block; overflow: visible; }
.hs .lgF, .hs .lgB, .hs .arF, .hs .arB { transform-box: fill-box; transform-origin: 50% 0%; }
.hs .e2, .hs .m2, .hs .m3, .hs .sw, .hs .br { display: none; }
.hs[data-mood="happy"] .e1, .hs[data-mood="happy"] .m1 { display: none; }
.hs[data-mood="happy"] .e2, .hs[data-mood="happy"] .m2 { display: inline; }
.hs[data-mood="happy"] .arB { transform: rotate(150deg); }
.hs[data-mood="happy"] .arF { transform: rotate(-150deg); }
.hs[data-mood="oops"] .m1 { display: none; }
.hs[data-mood="oops"] .m3, .hs[data-mood="oops"] .sw, .hs[data-mood="oops"] .br { display: inline; }
.herobig { width: 112px; margin: 0 auto; }
.herobig .hs { width: 100%; }

/* done */
.done { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.bigstars { display: flex; gap: 8px; }
.bigstars .star { width: 56px; height: 56px; }
.gift {
  background: var(--sun); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 var(--ink);
  padding: 10px 26px 12px; display: flex; flex-direction: column; align-items: center;
}
.gift:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.gift .gi { font-size: 4rem; line-height: 1.1; display: block; }
.gift .gt { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.reward { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.reward .stk { font-size: 4.6rem; line-height: 1.1; }
.stk-box { width: 120px; height: 120px; border-radius: 28px; border: 3px solid var(--ink); background: var(--card); display: grid; place-items: center; font-size: 4.4rem; box-shadow: 0 6px 0 var(--ink); }
.wmsg { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
.btn {
  font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; padding: 12px 20px; min-height: 58px;
  background: var(--card); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
}
.btn.main { background: var(--orange); color: #fff; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

/* rewards */
.rwgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hatc {
  background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink);
  padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; font-weight: 800; font-size: 0.85rem;
}
.hatc .he { font-size: 2rem; line-height: 1.1; }
.hatc.on { background: var(--sun); }
.hatc:disabled { cursor: default; }
.album { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.cell {
  aspect-ratio: 1; border-radius: 12px; border: 3px dashed #7FB59A; display: grid; place-items: center; font-size: 1.5rem;
  min-width: 0; color: #7FB59A; font-family: var(--font-display); font-weight: 800; background: transparent; padding: 0;
}
.cell.on { border: 3px solid var(--ink); background: var(--card); color: inherit; }
.cap { margin: 0; min-height: 1.3em; font-weight: 800; color: var(--muted); }

#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.conf { position: fixed; width: 10px; height: 14px; border-radius: 3px; }

@media (prefers-reduced-motion: no-preference) {
  .pip { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .pip[data-mood="happy"] { animation: hop 0.6s ease-out; }
  .it, .num, .blank, .rod, .cube { animation: pop 0.35s both; animation-delay: calc(var(--i, 0) * 45ms); }
  .opt.wrong { animation: shake 0.4s; }
  .reward .stk { animation: spin 0.9s ease-out; }
  .bigstars .star.on { animation: pop 0.5s both; animation-delay: calc(var(--i, 0) * 250ms + 200ms); }
  .gift .gi { animation: wiggle 1.2s ease-in-out infinite; }
  .heart.lost { animation: lose 0.5s ease-out; }
  .hero { transition: left 0.85s ease-in-out; }
  .hero.walking .hs { animation: stepbob 0.3s ease-in-out infinite alternate; }
  .hero.walking .lgF { animation: swA 0.3s ease-in-out infinite alternate; }
  .hero.walking .lgB { animation: swB 0.3s ease-in-out infinite alternate; }
  .hero.walking .arF { animation: arA 0.3s ease-in-out infinite alternate; }
  .hero.walking .arB { animation: arB 0.3s ease-in-out infinite alternate; }
  .hs[data-mood="happy"] { animation: hop 0.6s ease-out; }
  .hs[data-mood="oops"] { animation: wob 0.5s ease-out; }
  .opt, .btn, .lt, .wcard, .cont { transition: transform 0.08s, box-shadow 0.08s, background 0.12s; }
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-20px) scale(0.96, 1.06); } 60% { transform: translateY(0) scale(1.06, 0.94); } 100% { transform: translateY(0) scale(1, 1); } }
@keyframes wob { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes spin { 0% { transform: rotate(-200deg) scale(0.1); } 100% { transform: rotate(0) scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(5deg); } }
@keyframes lose { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes swA { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
@keyframes swB { from { transform: rotate(30deg); } to { transform: rotate(-30deg); } }
@keyframes arA { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
@keyframes arB { from { transform: rotate(38deg); } to { transform: rotate(-38deg); } }
@keyframes stepbob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@media (max-width: 380px) {
  .opt { font-size: 1.9rem; }
  .eq { font-size: 2rem; }
  .brand { font-size: 1.1rem; }
  .heart { width: 26px; height: 26px; }
  .rwgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="tools">
      <div class="chip" id="coinChip" aria-live="polite"></div>
      <div class="chip" id="streakChip"></div>
      <button class="chip" id="btnSound" type="button"></button>
      <button class="chip" id="btnLang" type="button"></button>
    </div>
  </header>

  <!-- HOME -->
  <section id="sHome" class="col">
    <div class="pipline"><div class="pipbox" id="pipHome"></div><div class="bubble" id="homeBubble"></div></div>

      qs = genLevel(n);
    }
    G = { lv: i, n: qs.length, qs: qs, qi: 0, hearts: 3, streak: 0, busy: false, mode: daily ? 'daily' : 'normal', id: run, q: null };
    var w = Math.floor(i / WS);
    show('play', w);
    $('scene').innerHTML = [WT[w % 8].e, '⭐', WT[w % 8].e, '⭐', WT[w % 8].e].map(function (e) { return '<span>' + e + '</span>'; }).join('');
    $('hero').innerHTML = heroHTML(S.hero, false);
    renderChrome();
    renderHearts(false);
    nextQ();
  }
  function nextQ() {
    if (G.qi >= G.n) { finish(); return; }
    var q = G.qs[G.qi];
    G.q = q; G.busy = false;
    renderDots();
    $('prompt').textContent = promptOf(q);
    $('visual').innerHTML = q.vis;
    var h = '';
    for (var i = 0; i < q.opts.length; i++) {
      var o = q.opts[i];
      h += '<button type="button" class="opt' + (q.kind === 'compare' || q.kind === 'bigger' ? ' card' : '') + '" data-k="' + i + '">' + o.html + '</button>';
    }
    $('opts').style.setProperty('--n', String(q.opts.length));
    $('opts').innerHTML = h;
    setMsg(L('tap'));
    heroHome();
    setMood($('hero'), 'idle');
  }
  function onAnswer(k) {
    if (!G || G.busy || !G.q) return;
    var btn = $('opts').children[k];
    if (!btn || btn.disabled) return;
    G.busy = true;
    var my = G.id;
    var wr = $('walk').getBoundingClientRect(), br = btn.getBoundingClientRect();
    var pct = ((br.left + br.width / 2 - wr.left) / wr.width) * 100;
    walkTo(pct, function () {
      if (!G || G.id !== my) return;
      var o = G.q.opts[k];
      if (o.ok) {
        G.streak++;
        S.coins += 2;
        btn.classList.add('right');
        Array.prototype.forEach.call($('opts').children, function (b) { b.disabled = true; });
        Array.prototype.forEach.call($('visual').querySelectorAll('[data-ans]'), function (el) { el.textContent = el.getAttribute('data-ans'); el.classList.add('shown'); });
        sGood(); burst(btn, 26); setMood($('hero'), 'happy');
        setMsg(pick2(L('great')) + (G.streak >= 3 ? ' 🔥 ' + G.streak + ' ' + L('row') : ''));
        save();
        setTimeout(function () { if (!G || G.id !== my) return; G.qi++; nextQ(); }, 1150);
      } else {
        G.hearts--; G.streak = 0;
        btn.classList.add('wrong'); btn.disabled = true;
        sBad(); setMood($('hero'), 'oops'); renderHearts(true);
        setMsg(L('oops'));
        if (G.hearts <= 0) {
          setTimeout(function () { if (!G || G.id !== my) return; fail(); }, 1100);
        } else {
          setTimeout(function () {
            if (!G || G.id !== my) return;
            walkTo(50, function () { if (!G || G.id !== my) return; G.busy = false; setMsg(L('tap')); });
          }, 800);
        }
      }
    });
  }
  function pick2(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- results ---------- */
  function showDone(d) {
    lastDone = d;
    show('done', Math.floor(d.lv / WS));
    renderChrome();
    $('heroDone').innerHTML = heroHTML(S.hero, false);
    $('doneTitle').textContent = d.title;
    $('bigStars').innerHTML = d.stars >= 0 ? [0, 1, 2].map(function (k) { return starSVG(k < d.stars).replace('<svg class="star', '<svg style="--i:' + k + '" class="star'); }).join('') : '';
    $('bigStars').hidden = d.stars < 0;
    $('gift').hidden = !d.gift;
    $('giftTxt').textContent = L('gift');
    $('reward').hidden = true;
    $('wmsg').textContent = d.msg || '';
    $('btnNext').hidden = !d.next;
    $('btnNext').setAttribute('data-lv', String(d.lv + 1));
    $('btnAgain').textContent = d.win ? L('again') : L('tryAgain');
    $('btnAgain').hidden = d.mode === 'daily' && d.win;
    $('btnAgain').setAttribute('data-lv', String(d.lv));
    $('btnAgain').setAttribute('data-mode', d.mode);
    sWin();
    setMood($('heroDone'), d.win ? 'happy' : 'oops', true);
    if (d.win) setTimeout(function () { if (CUR === 'done') burst($('bigStars'), 36); }, 250);
  }
  function finish() {
    var i = G.lv, daily = G.mode === 'daily';
    if (daily) {
      S.dailyDay = dayStr(new Date());
      S.coins += 30;
      save();
      showDone({ lv: i, win: true, stars: -1, gift: false, title: L('daily'), msg: '', next: false, mode: 'daily' });
      return;
    }
    var stars = G.hearts, msg = '', idx = i % STK.length;
    S.stars[i] = Math.max(S.stars[i], stars);
    if (stars === 3) S.coins += 10;
    save();
    var lastOfWorld = (i + 1) % WS === 0;
    msg = (lastOfWorld ? L('worldDone') + ' ' + WT[Math.floor(i / WS) % 8].e + ' ' : '') + (stars === 3 ? L('coinsGot') : '');
    if (i === NL - 1 && S.stars.every(function (x) { return x > 0; })) msg = L('allDone');
    showDone({ lv: i, win: true, stars: stars, gift: true, idx: idx, title: L('done'), msg: msg, next: i < NL - 1, mode: 'normal', boss: (i + 1) % 10 === 0 });
  }
  function fail() {
    var i = G.lv;
    showDone({ lv: i, win: false, stars: -1, gift: false, title: L('failTitle'), msg: L('failSub'), next: false, mode: G.mode });
  }
  function openGift() {
    if (!lastDone || !lastDone.gift) return;
    var idx = lastDone.idx;
    $('gift').hidden = true;
    $('reward').hidden = false;
    var box = $('rwIcon');
    box.textContent = STK[idx];
    if (!S.stick[idx]) { S.stick[idx] = 1; $('rwTxt').textContent = L('newSticker'); }
    else { S.coins += 5; $('rwTxt').textContent = L('dupe'); }
    save();
    sWin();
    burst(box, 50);
    renderChrome();
  }

  /* ---------- events ---------- */
  $('cont').addEventListener('click', function () { sTap(); startLevel(+$('cont').getAttribute('data-i'), 'normal'); });
  $('dailyBtn').addEventListener('click', function () { if (S.dailyDay === dayStr(new Date())) return; sTap(); startLevel(0, 'daily'); });
  $('worlds').addEventListener('click', function (e) {
    var b = e.target.closest('.wcard'); if (!b || b.disabled) return;
    sTap(); renderWorld(+b.getAttribute('data-w')); show('world', +b.getAttribute('data-w'));
  });
  $('wGrid').addEventListener('click', function (e) {
    var b = e.target.closest('.lt'); if (!b || b.disabled) return;
    sTap(); startLevel(+b.getAttribute('data-lv'), 'normal');
  });
  $('wBack').addEventListener('click', function () { show('home'); renderHome(); });
  $('pBack').addEventListener('click', function () { run++; G = null; show('home'); renderHome(); });
  $('opts').addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    onAnswer(+b.getAttribute('data-k'));
  });
  $('gift').addEventListener('click', openGift);
  $('btnNext').addEventListener('click', function () { startLevel(+$('btnNext').getAttribute('data-lv'), 'normal'); });
  $('btnAgain').addEventListener('click', function () {
    var lv = +$('btnAgain').getAttribute('data-lv'), mode = $('btnAgain').getAttribute('data-mode') || 'normal';
    startLevel(lv, mode === 'daily' ? 'daily' : 'normal');
  });
  $('btnHome').addEventListener('click', function () { run++; G = null; show('home'); renderHome(); });
  $('btnRw').addEventListener('click', function () { sTap(); show('rw'); renderRw(); });
  $('rwBack').addEventListener('click', function () { show('home'); renderHome(); });
  $('hatGrid').addEventListener('click', function (e) {
    var b = e.target.closest('.hatc'); if (!b || b.disabled) return;
    var id = b.getAttribute('data-hat'), ht = HATS.filter(function (x) { return x.id === id; })[0];
    if (!ht) return;
    if (S.hats.indexOf(id) < 0) {
      if (S.coins < ht.c) { sBad(); return; }
      S.coins -= ht.c; S.hats.push(id);
    }
    S.hat = id; save(); sTap(); renderRw();
  });
  $('btnSound').addEventListener('click', function () { S.mute = !S.mute; save(); sTap(); renderChrome(); });
  $('btnLang').addEventListener('click', function () {
    S.lang = S.lang === 'en' ? 'uz' : 'en'; save();
    if (CUR === 'home') renderHome();
    else if (CUR === 'world') renderWorld(CURW);
    else if (CUR === 'rw') renderRw();
    else if (CUR === 'play' && G) { $('prompt').textContent = promptOf(G.q); renderChrome(); }
    else if (CUR === 'done' && lastDone) showDone(lastDone);
    else renderChrome();
  });
  ['hpAli', 'hpMalika'].forEach(function (id) {
    $(id).addEventListener('click', function () { S.hero = $(id).getAttribute('data-h'); save(); sTap(); renderChrome(); });
  });
  $('hpAli').setAttribute('data-h', 'ali');
  $('hpMalika').setAttribute('data-h', 'malika');
  $('btnReset').addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true; renderHome();
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () { resetArmed = false; renderHome(); }, 4000);
    } else {
      resetArmed = false; clearTimeout(resetTimer);
      S.stars = S.stars.map(function () { return 0; });
      S.coins = 0; S.hat = 'none'; S.hats = ['none']; S.stick = S.stick.map(function () { return 0; });
      S.dailyDay = ''; S.streak = 0; S.lastDay = '';
      save(); renderHome();
    }
  });

  /* test hook (inert for kids): lets the test script read the generator and state */
  window.__PQ = {
    genLevel: genLevel,
    start: function (i, m) { startLevel(i, m || 'normal'); },
    cur: function () { return G && G.qs[G.qi]; },
    G: function () { return G; },
    S: function () { return S; }
  };

  show('home');
  renderHome();
})();
</script>
